// auth.proto —— 用户认证服务契约（P2-A）
//
// 本文件是认证域的唯一事实来源：所有消费方（auth-service 实现、
// gateway 客户端）都依赖它生成的代码，禁止手工维护"另一份"定义。
//
// 设计要点：
//   - user_id 不放在请求体中，由 gateway 解析 JWT 后通过 gRPC metadata
//     注入（键：x-user-id），服务端从 metadata 取，避免信任客户端入参；
//   - agent_id（分智能体来源）由 gateway 从路径参数 /v1/auth/(login|register)/{agent_id}
//     解析后放入请求体透传，服务端据此写入用户标签 {key:"agent", value:<agent_id>}；
//   - 用户标签（tags，JSON key-value 数组）用于分用户群体控制前端配置可见性等；
//   - 错误通过 gRPC status + 统一错误码传递（见 backend/internal/errors）。
syntax = "proto3";

package auth.v1;

option go_package = "github.com/Steve5201/agent-backend/internal/proto/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// AuthService 用户认证服务：注册 / 登录 / 刷新 / 登出 / 我的信息 / 管理员用户管理 / 智能体管理。
service AuthService {
  // Register 注册新用户。username 冲突返回 ALREADY_EXISTS。
  // agent_id 非空时写入 agent 标签（普通用户经 /v1/auth/register/{agent_id} 入口）。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login 登录，签发 access_token + refresh_token（refresh 入库，属同一 token 族）。
  // agent_id 非空且用户尚无该标签时补写（首次经某智能体门户登录即绑定该智能体）。
  rpc Login(LoginRequest) returns (LoginResponse);
  // Refresh 用 refresh_token 换取新 access_token，旧 refresh 吊销（族轮换，单次使用）。
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Logout 吊销该 refresh_token 所在的整个族（全设备下线）。
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Me 返回当前用户资料（从 metadata 的 x-user-id 解析，含标签）。
  rpc Me(MeRequest) returns (MeResponse);
  // ChangePassword 用户自助修改密码（校验旧密码；改密后吊销该用户全部
  // refresh token，强制重新登录）。user_id 从 metadata 的 x-user-id 解析。
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // AdminCreateUser 管理员创建用户（管理员只能被创建，不能自助注册）。
  rpc AdminCreateUser(AdminCreateUserRequest) returns (AdminCreateUserResponse);
  // AdminListUsers 管理员分页查看用户（可按用户名模糊搜索）。
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  // AdminUpdateUser 管理员重置用户密码（调用者角色须高于被重置账号，防横向越权）。
  rpc AdminUpdateUser(AdminUpdateUserRequest) returns (AdminUpdateUserResponse);
  // AdminDeleteUser 管理员删除用户（调用者角色须高于被删除账号；禁止删除自己）。
  rpc AdminDeleteUser(AdminDeleteUserRequest) returns (AdminDeleteUserResponse);
  // AdminGetUsersByIds 按 ID 批量查询用户（数据管理模块 Top 用户用户名回填；
  // 调用者须具备用户管理权；只返回存在的用户，不存在的静默跳过）。
  rpc AdminGetUsersByIds(AdminGetUsersByIdsRequest) returns (AdminGetUsersByIdsResponse);
  // ListAgents 智能体列表（最高超管看全部，其它按归属过滤）。
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // CreateAgent 创建智能体（仅最高超管；owner 可空，稍后经 BindAgentOwner 绑定）。
  // owner 被授予该智能体的 agent_admin 角色并绑定 agent 标签。
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  // BindAgentOwner 绑定/更换/解绑智能体超管（仅最高超管）。
  // 绑定新 owner：回收旧 owner 的 agent_admin 角色与 agent 标签，授予新 owner；
  // owner_user_id 为空串 = 仅解绑当前 owner（不授予新 owner）。
  rpc BindAgentOwner(BindAgentOwnerRequest) returns (BindAgentOwnerResponse);
  // GetAgent 智能体详情（最高超管任意；其它角色仅限归属域）。
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  // GetAgentPublic 公开智能体元数据（任意登录用户可查，仅返回前台展示/装配
  // 字段，不含 owner/status 等管理信息）。gateway 创建会话时据此注入按智能体
  // system_prompt——普通用户无需管理权限即可获取，与门户登录归属语义一致。
  rpc GetAgentPublic(GetAgentRequest) returns (GetAgentPublicResponse);
  // UpdateAgent 更新智能体元数据（名称/描述/模型/形象/系统提示词/推理强度）。
  // 超管任意；agent_admin 仅限自身归属域（不允许改 owner）。
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  // SetAgentStatus 启停智能体（status=0 停用后该域禁止创建会话；仅最高超管）。
  rpc SetAgentStatus(SetAgentStatusRequest) returns (SetAgentStatusResponse);
  // DeleteAgent 软删除智能体（标记停用；仅最高超管；tutor 等系统内置禁止删除）。
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
}

message RegisterRequest {
  string username = 1; // 用户名（3~32 字符，字母数字下划线）
  string password = 2; // 密码（>=8 位，须含字母与数字）
  string agent_id = 3; // 分智能体注册来源（/v1/auth/register/{agent_id} 解析，可为空）
}

message RegisterResponse {
  string user_id = 1;  // 新用户 ID
  string username = 2; // 用户名
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string agent_id = 3; // 分智能体登录来源（/v1/auth/login/{agent_id} 解析，可为空）
}

message LoginResponse {
  string access_token = 1;  // JWT，短期有效
  string refresh_token = 2; // 不透明令牌，长期有效（7d），可吊销
  int64 expires_in = 3;     // access_token 有效期（秒），前端用于自动续期倒计时
  User user = 4;            // 当前用户资料
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2; // 新 refresh（旧的一次性吊销）
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1; // 待吊销的 refresh token（吊销其整个族）
}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

// ChangePasswordRequest 用户自助修改密码。
message ChangePasswordRequest {
  string old_password = 1; // 旧密码（须与当前密码一致）
  string new_password = 2; // 新密码（>=8 位，须同时包含字母与数字）
}

message ChangePasswordResponse {}

// User 用户资料。
message User {
  string id = 1;
  string username = 2;
  string role = 3;                // user | admin（RBAC）
  google.protobuf.Timestamp created_at = 4;
  repeated Tag tags = 5;          // 用户标签（分智能体来源 / 用户群体）
}

// Tag 用户标签（key-value 对）。key 语义由调用方约定（如 "agent" = 分智能体来源）。
message Tag {
  string key = 1;
  string value = 2;
}

// AdminCreateUserRequest 管理员创建用户。
message AdminCreateUserRequest {
  string username = 1;  // 用户名（唯一）
  string password = 2;  // 初始密码（>=8 位，须含字母与数字）
  string role = 3;      // user | admin
  string agent_id = 4;  // 可选：追加 agent 标签
  repeated Tag tags = 5; // 追加自定义标签（与 agent 标签合并）
}

message AdminCreateUserResponse {
  User user = 1;
}

// AdminListUsersRequest 管理员分页查询用户。
message AdminListUsersRequest {
  int32 page = 1;      // 页码（从 1 起，默认 1）
  int32 page_size = 2; // 每页条数（默认 20，上限 100）
  string keyword = 3;  // 用户名模糊搜索（可选）
}

message AdminListUsersResponse {
  repeated User users = 1; // 当前页用户
  int32 total = 2;         // 符合条件的总条数
}

// AdminUpdateUserRequest 管理员重置用户密码。
message AdminUpdateUserRequest {
  string user_id = 1;      // 被重置账号 ID
  string new_password = 2; // 新密码（>=8 位，须含字母与数字）
}

message AdminUpdateUserResponse {
  User user = 1; // 重置后的用户（绝不携带密码哈希）
}

// AdminDeleteUserRequest 管理员删除用户。
message AdminDeleteUserRequest {
  string user_id = 1; // 被删除账号 ID
}

message AdminDeleteUserResponse {}

// AdminGetUsersByIdsRequest 按 ID 批量查询用户请求。
message AdminGetUsersByIdsRequest {
  repeated string user_ids = 1; // 用户 ID（去重后最多 100 个；超出部分拒绝）
}

// AdminGetUsersByIdsResponse 按 ID 批量查询用户响应。
message AdminGetUsersByIdsResponse {
  repeated User users = 1; // 只含存在的用户（顺序与请求一致；不存在的静默跳过）
}

// Agent 智能体注册表条目（阶段3·多租户）。
message Agent {
  string id = 1;                 // 智能体 ID（如 'tutor'），与 sessions.agent_id / 资源归属对应
  string name = 2;               // 展示名
  string description = 3;        // 描述
  string model = 4;              // 默认模型
  string owner_user_id = 5;      // 智能体超管（agent_admin）的 users.id
  int32 status = 6;              // 1=正常 0=停用
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string avatar = 9;             // 形象（emoji，如 "🦉"；空 = 用首字兜底）
  string welcome = 10;           // 欢迎语（新会话首屏展示；空 = 用实例默认）
  string system_prompt = 11;     // 按智能体系统提示词（空 = 用实例全局 prompt）
  string reasoning_effort = 12;  // 默认推理强度 low/high/max（空 = 用实例默认）
}

// ListAgentsRequest 智能体列表（无参：按调用者角色返回可见范围）。
message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

// CreateAgentRequest 创建智能体（仅最高超管可调）。
message CreateAgentRequest {
  string id = 1;             // 智能体 ID（白名单 ^[A-Za-z0-9-]{1,64}$）
  string name = 2;           // 展示名（非空）
  string description = 3;    // 描述（可选）
  string model = 4;          // 默认模型（可选）
  string owner_user_id = 5;  // 智能体超管（agent_admin）用户 ID（可选，空 = 稍后经 BindAgentOwner 绑定）
  string avatar = 6;         // 形象 emoji（可选）
  string welcome = 7;        // 欢迎语（可选）
  string system_prompt = 8;  // 按智能体系统提示词（可选）
  string reasoning_effort = 9; // 默认推理强度 low/high/max（可选）
}

message CreateAgentResponse {
  Agent agent = 1;
}

// BindAgentOwnerRequest 绑定/更换/解绑智能体超管（仅最高超管可调）。
// owner_user_id 为空串 = 仅解绑当前 owner（不授予新 owner）。
// 更换 owner 时旧 owner 的 agent_admin 角色与 agent 标签被回收。
message BindAgentOwnerRequest {
  string id = 1;              // 智能体 ID
  string owner_user_id = 2;   // 新超管用户 ID（可选，空串 = 解绑）
}

message BindAgentOwnerResponse {
  Agent agent = 1; // 绑定后的智能体记录（owner_user_id 可能为空）
}

// GetAgentRequest 智能体详情。
message GetAgentRequest {
  string id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

// GetAgentPublicResponse 公开智能体元数据（前台可展示/装配字段白名单，
// 不含 owner_user_id / created_at 等管理字段；status 仅暴露启停位，供前端
// 域守卫判断"已停用"）。
message GetAgentPublicResponse {
  string id = 1;                 // 智能体 ID
  string name = 2;               // 展示名
  string description = 3;        // 描述
  string avatar = 4;             // 形象 emoji
  string welcome = 5;            // 欢迎语
  string system_prompt = 6;      // 按智能体系统提示词（空 = 用实例全局 prompt）
  string reasoning_effort = 7;   // 默认推理强度 low/high/max（空 = 用实例默认）
  int32 status = 8;              // 1=启用 0=停用（严格多租户域校验用）
}

// UpdateAgentRequest 更新智能体元数据。
// 空串字段 = 清空（name 除外：非空）；reasoning_effort 校验 low/high/max。
message UpdateAgentRequest {
  string id = 1;
  string name = 2;              // 非空
  string description = 3;
  string model = 4;
  string avatar = 5;
  string welcome = 6;
  string system_prompt = 7;
  string reasoning_effort = 8;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

// SetAgentStatusRequest 启停智能体。
message SetAgentStatusRequest {
  string id = 1;
  int32 status = 2;   // 1=启用 0=停用（其它值拒绝）
}

message SetAgentStatusResponse {
  Agent agent = 1;
}

// DeleteAgentRequest 删除智能体（软删除：标记停用）。
message DeleteAgentRequest {
  string id = 1;
}

message DeleteAgentResponse {}
