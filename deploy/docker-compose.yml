# 全栈编排：PostgreSQL + 后端六服务（P2-F / P3-A / P6-B）。
#
# 本文件 = 生产基础编排（P6-B）：不暴露 postgres/ollama 宿主端口，ollama 仅
# dev profile 加载（云端 2G 内存跑不动 bge-m3，embedding 走硅基流动，见 .env.prod）。
#
# 用法：
#   1. 复制 .env.example 为 .env 并填好 DB_PASSWORD / DEEPSEEK_API_KEY / JWT_SECRET
#   2. 生产：docker compose -f deploy/docker-compose.yml up -d --build
#      本地：docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml
#            --profile dev up -d --build   （或直接 .\scripts\dev-up.ps1 [-Rebuild]）
#   3. 冒烟测试：.\scripts\smoke.ps1
#
# 服务间通过 compose 网络用服务名互访（agent → llm-gateway、gateway → auth/agent、
# rag → ollama）。RAG 默认走本地 Ollama（dev profile，开源免费）；云端切硅基流动
# 在 .env 设置 SILICONFLOW_API_KEY 并覆盖 RAG_EMBEDDING_BASE_URL / RAG_EMBEDDING_MODEL
# （见 rag 服务注释）。
name: agent-stack

# 日志限额（json-file driver）：单文件 50MB、保留 5 份轮转，防长期运行写满磁盘。
# 各服务统一引用；实时排查用 `docker compose logs -f <service>`，
# 需要落盘则在服务里设 LOG_FILE（挂载 logs 卷，见各服务 volumes）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 设置 DB_PASSWORD}
    # P6-B：不再暴露宿主端口（生产基础编排）；本地开发经 docker-compose.dev.yml 恢复 5432。
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时自动建各服务独立库（auth/agent/llm）；已存在的卷不生效。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  # 本地向量模型（P3-A）：开源免费。P6-B 起仅 dev profile 加载——生产（云端
  # 2G 内存）跑不动 bge-m3，embedding 切硅基流动（见 .env.prod 差异点④）。
  # 本地启动时自动拉取 bge-m3（约 1.2GB，首次较慢，后续启动为秒级 no-op）。
  # rag 是它的软依赖方：模型未就绪时 rag 照常启动，检索接口返回明确提示。
  # 模型落盘到宿主机 deploy/data/ollama/models（Windows 可直接浏览/备份，
  # 迁移服务器时整个目录拷走即可，免重新下载）。
  ollama:
    profiles: ["dev"] # 仅本地开发拉起（--profile dev）；生产编排默认不部署
    image: ollama/ollama:latest
    # 镜像默认 entrypoint 是 ollama 命令本身：必须显式覆盖为 sh，
    # 否则 compose 的 command 会被拼成 `ollama sh -c …` 而报 unknown command。
    # 启动流程：后台起 serve → 拉 bge-m3（首次约 1.2GB，已存在时秒级 no-op）→ 保持前台。
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull bge-m3 && wait"]
    # P6-B：不再暴露宿主端口；本地开发经 docker-compose.dev.yml 恢复 11434。
    volumes:
      - ./data/ollama:/root/.ollama # 模型持久化（宿主机目录，重启/重建不重复下载）
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: auth }
    environment:
      DB_HOST: postgres
      DB_NAME: auth
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 设置 JWT_SECRET}
      GRPC_PORT: "8081"
      HTTP_PORT: "8181"
      # 初始超级管理员（首次启动播种，仅创建、不覆盖已有账号）。
      # 生产环境务必设置 AUTH_ADMIN_PASSWORD，勿用默认密码！
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-Admin@2026}
      # 日志落盘路径（挂载 logs 卷持久化；不设则仅 stdout 由 docker logs 捕获）。
      LOG_FILE: /logs/auth.log
    ports:
      - "8081:8081" # gRPC
      - "8181:8181" # healthz
    volumes:
      - logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: llm-gateway }
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 deploy/.env 设置 DEEPSEEK_API_KEY}
      # 模型注册表管理令牌（P3 大模型管理）：与 gateway 共享，保护 /v1/admin/models*。
      # 留空 = 管理端模型模块禁用（503 提示），不影响对话/用量。
      LLM_ADMIN_TOKEN: ${LLM_ADMIN_TOKEN:-}
      # 启动批量播种的管理模型（JSON 数组，可选，见 deploy/.env 注释）。
      # 留空 = 不批量播种，模型全部经管理端 UI 手动添加。
      ADMIN_MODELS: ${ADMIN_MODELS:-}
      DB_HOST: postgres
      DB_NAME: llm
      DB_PASSWORD: ${DB_PASSWORD}
      HTTP_PORT: "8083"
      LOG_FILE: /logs/llm-gateway.log
    ports:
      - "8083:8083"
    volumes:
      - logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  sandbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: sandbox
        RUN_AS: root # unshare/setpriv/chown/setfacl 需要 root 主进程（执行时降权到每用户专属 uid）
    environment:
      HTTP_PORT: "8087"
      LOG_FILE: /logs/sandbox.log
      # 每用户独立工作区根目录（挂载 data/agent 卷，与 agent 的 /app 同一份数据）。
      SANDBOX_WORK_ROOT: /work
      # 单进程虚拟内存 / CPU 时间 / 打开文件数上限（prlimit，0 = 不限制）。
      # 默认 2048：slide-maker 的 equation_png（matplotlib mathtext 公式转 PNG）
      # 走普通 code 执行，而 numpy+matplotlib 初始化虚拟内存远超 512MB（实测
      # 512MB 下 import 即被 OOM SIGKILL，"signal: killed"）。2048 与 profile
      # 模式一致，兼顾公式渲染；需收紧可在 .env 里覆盖 SANDBOX_MEMORY_MB。
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-2048}
      # profile 模式（可信预置解析/渲染脚本）单独的内存上限：matplotlib/numpy
      # 渲染公式/图片的虚拟内存需求远超普通代码，512MB 下会 syscall 风暴卡死。
      SANDBOX_PROFILE_MEMORY_MB: ${SANDBOX_PROFILE_MEMORY_MB:-2048}
      # CPU 时间上限：默认 120s（覆盖 matplotlib 首次冷启动字体扫描等极端情况；
      # 字体缓存预置后 import 秒级，正常脚本远用不满）。
      SANDBOX_CPU_SECONDS: ${SANDBOX_CPU_SECONDS:-120}
      SANDBOX_NOFILE: ${SANDBOX_NOFILE:-1024}
      # 单次执行最大超时（默认 300s：覆盖 matplotlib 字体扫描与复杂 PPT 构建）
      # / 最大并发执行数。
      SANDBOX_MAX_TIMEOUT_SECONDS: ${SANDBOX_MAX_TIMEOUT_SECONDS:-300}
      SANDBOX_MAX_WORKERS: ${SANDBOX_MAX_WORKERS:-4}
      # 工作区定期清理（模块三）：过期 chat-files/ingest 目录（0 = 禁用）。
      SANDBOX_CLEANUP_INTERVAL_HOURS: ${SANDBOX_CLEANUP_INTERVAL_HOURS:-6}
      SANDBOX_CLEANUP_TTL_HOURS: ${SANDBOX_CLEANUP_TTL_HOURS:-168}
      # 命令白名单（逗号分隔正则，空 = 仅黑名单限制）。
      SANDBOX_CODE_EXEC_ALLOWLIST: ${SANDBOX_CODE_EXEC_ALLOWLIST:-}
      # 每用户独立 uid 隔离（档位 B）：
      #   - SANDBOX_AGENT_UID / SANDBOX_AGENT_GID：agent 容器内 app 用户 uid/gid。
      #     用户工作区属主 = 派生 uid，属组 = app 组，mode 2775（setgid 继承组）：
      #     沙盒执行进程是属主 → 可写；agent 经组权限协作读写；其它用户
      #     uid/gid 均不匹配且 other=0 → OS 级拒绝（跨用户强隔离）。
      #     ⚠ 不能用 POSIX ACL：Docker Desktop bind mount 不支持 setfacl（实测
      #     "Not supported"），档位 B 的协作统一走组权限位，无需 acl 包。
      #   - SANDBOX_UID_BASE：沙盒执行用户 uid 池起点；每个用户映射
      #     uid = SANDBOX_UID_BASE + user_id（uid==gid，线性不碰撞）。
      SANDBOX_AGENT_UID: "100"
      SANDBOX_AGENT_GID: "101"
      SANDBOX_UID_BASE: ${SANDBOX_UID_BASE:-2000}
      # 预置解析脚本目录（P3-A3b profile 模式执行；镜像构建期 COPY，运行时只读）。
      SANDBOX_PARSERS_DIR: /opt/rag-parsers
      # matplotlib 字体缓存目录：Dockerfile 构建期预热生成（同镜像字体不变则
      # 缓存永远有效），运行时 import matplotlib 直接命中，免去 >30s 的 Noto CJK
      # 字体扫描（这是之前 measure_*/equation_png 超时、被 CPU/内存 kill 的根因）。
      MPLCONFIGDIR: /opt/mplconfig
    # 安全加固：根文件系统只读（仅 /work /logs /tmp 可写）+ 精选能力集。
    # 说明：执行链路需要的能力必须显式保留，缺失任一都会启动失败——
    #   SYS_ADMIN（unshare -n 建独立网络命名空间）、SETUID/SETGID（setpriv 降权到
    #   每用户专属 uid）、CHOWN/FOWNER/FSETID（建用户工作区、setgid 继承）、
    #   DAC_OVERRIDE（递归 chown -R / setfacl -R 迁移旧卷）、KILL（超时终止进程组）。
    #   执行代码经 setpriv 降权到用户专属 uid 后不继承任何能力，且处于无网卡的
    #   独立网络命名空间内。
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - NET_RAW
    tmpfs:
      # 256m：matplotlib 公式渲染的 MPLCONFIGDIR 兜底、PIL/临时文件都落在 /tmp。
      - /tmp:size=256m,exec
    volumes:
      - ./data/agent:/work
      - logs:/logs
      # matplotlib 字体缓存持久卷：匿名卷首次挂载时 copy-up 镜像构建期预热的
      # /opt/mplconfig 缓存（同镜像字体不变则有效），容器内可写（缓存锁等）。
      - mplconfig:/opt/mplconfig
    # 不发布宿主端口：仅 compose 内部网络被 agent 调用，外界不可达。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: agent }
    environment:
      DB_HOST: postgres
      DB_NAME: agent
      DB_PASSWORD: ${DB_PASSWORD}
      GRPC_PORT: "8082"
      HTTP_PORT: "8182"
      # 上游必须是容器网络里的 llm-gateway，而非 localhost。
      # 注意带 /v1：framework 拼路径为 baseURL + /chat/completions，
      # llm-gateway 的 OpenAI 兼容路由是 POST /v1/chat/completions。
      AGENT_LLM_BASE_URL: http://llm-gateway:8083/v1
      # 内置工具集：L2/L3 工具自动放行（个人本地部署，记审计日志）。
      AGENT_AUTO_APPROVE_TOOLS: "true"
      # 本地媒体基址：模型输出的 /files URL 由浏览器访问，指向宿主机映射端口。
      # 本地 localhost:8182；云端配公网 IP（见 deploy/.env.prod AGENT_FILES_BASE_URL）。
      AGENT_FILES_BASE_URL: ${AGENT_FILES_BASE_URL:-http://localhost:8182}
      # web_search 搜索后端：bing（国内可直连，默认）| duckduckgo（海外）。
      AGENT_WEB_SEARCH_BACKEND: bing
      # code_executor 命令白名单（逗号分隔正则，空 = 仅黑名单限制）。
      # 例：只允许 echo 与 python print → AGENT_CODE_EXEC_ALLOWLIST: "\\becho\\b,^print\\("
      AGENT_CODE_EXEC_ALLOWLIST: ""
      # 沙盒服务地址（阶段2）：非空时代码执行委托 sandbox-service（禁网+资源限制+
      # 每用户独立工作区）；留空 = agent 进程内本地执行（本地开发降级）。
      AGENT_SANDBOX_URL: http://sandbox:8087
      # 工作区根：与沙盒/rag 共享卷一致（容器内 /work = 宿主机 deploy/data/agent，
      # 也是 /app 的同一宿主目录）。file_ops、聊天文档落盘、私有媒体迁移、/files
      # 静态服务都以此为根；不设则回退进程工作目录 /app（行为等价，但显式更稳）。
      AGENT_WORK_ROOT: /work
      # 知识库检索（P3-A6）：rag-service gRPC 地址，非空时装配 kb_search 工具。
      # rag 是软依赖——拨号失败仅降级（不注册 kb 工具），不影响对话。
      AGENT_RAG_ADDR: rag:8085
      # 技能目录（Anthropic Agent Skills 格式）：容器内 /app/skills = 宿主机 deploy/data/agent/skills。
      # 每个含 SKILL.md 的子目录自动注册为 skill_<名称> 工具；目录不存在 = 零技能。
      # 管理端与 agent 读写同一目录：管理端保存技能 → fsnotify 热加载，免重启生效。
      AGENT_SKILLS_DIR: /app/skills
      # 外部 MCP Server 列表（JSON 数组，字段见 backend/internal/tools/mcp.ServerConfig）。
      # 空 = 不加载；连接失败仅警告并跳过该 server 的工具，不影响启动。
      # 例（stdio 本地命令）：[{"name":"github","transport":"stdio","command":"npx","args":["-y","@modelcontextprotocol/server-github"],"default_permission":"L2"}]
      # 例（http 远程）：[{"name":"weather","transport":"http","url":"https://mcp.example.com/weather","headers":{"Authorization":"Bearer x"},"default_permission":"L1"}]
      # 本文件与 AGENT_MCP_SERVERS_JSON 同义，二选一即可；配置为管理端读写 + agent 热加载的
      # 单一事实源（文件优先于环境变量，见 agent 启动装配逻辑）。
      AGENT_MCP_CONFIG_FILE: /app/mcp_servers.json
      AGENT_MCP_SERVERS_JSON: ""
      # 日志落盘路径（挂载 logs 卷；工具审计等关键日志也会进入 agent 库 audit_tool_calls 表）。
      LOG_FILE: /logs/agent.log
      # 图片视觉解析（聊天上传图片，可选）：三项配齐才启用；VISION_MODEL 留空
      # = 不启用（图片仅渲染、不解析内容）。密钥默认复用 DEEPSEEK_API_KEY。
      # VISION_FALLBACK_MODEL 备用视觉模型（可选）：主模型失败（如限流 429）
      # 自动切换重试；BASE_URL/API_KEY 缺省复用主配置。
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_FALLBACK_MODEL: ${VISION_FALLBACK_MODEL:-}
      VISION_FALLBACK_BASE_URL: ${VISION_FALLBACK_BASE_URL:-}
      VISION_FALLBACK_API_KEY: ${VISION_FALLBACK_API_KEY:-}
      VISION_THINKING: ${VISION_THINKING:-}
      # 聊天上传限制（P4-L 收口 env）：单文档 20MB、每会话 20 份、解析正文
      # 单次截断 8000 字。单文档大小应与 gateway 侧 GATEWAY_CHAT_UPLOAD_MAX_MB
      # 保持一致（gateway 先按同值拦截，agent 再兜底校验）。
      AGENT_CHAT_DOC_MAX_SIZE_MB: ${AGENT_CHAT_DOC_MAX_SIZE_MB:-20}
      AGENT_CHAT_DOCS_PER_SESSION: ${AGENT_CHAT_DOCS_PER_SESSION:-20}
      AGENT_CHAT_DOC_INJECT_RUNES: ${AGENT_CHAT_DOC_INJECT_RUNES:-8000}
      # 编排子任务韧性（P4-L 收口 env）：单任务超时 30 分钟（0=不限制）、
      # 可重试错误整任务重试 1 次（指数退避，覆盖 5xx/429/网络/超时）。
      # 单个角色还可通过角色级超时覆盖（research/outline/content/review/worker，
      # 见 backend/internal/agentsvc/orchestrate.go orchestrationRoles）。
      AGENT_ORCH_SUBTASK_TIMEOUT_SEC: ${AGENT_ORCH_SUBTASK_TIMEOUT_SEC:-1800}
      AGENT_ORCH_SUBTASK_RETRIES: ${AGENT_ORCH_SUBTASK_RETRIES:-1}
      # 公式默认渲染方式（render_document）：image = matplotlib 图片（稳健，
      # 默认）；native = OMML 原生公式（docx 可编辑，仅支持常见 LaTeX 子集，
      # 失败自动回退图片）。
      DOC_FORMULA_RENDER: ${DOC_FORMULA_RENDER:-image}
    ports:
      - "8082:8082" # gRPC
      - "8182:8182" # healthz
    volumes:
      # 智能体工作目录 = 容器内 /app = 宿主机 deploy/data/agent。
      # file_ops 写的文件、/files 读取的本地媒体都在这里，重建容器不丢失。
      - ./data/agent:/app
      # 聊天文档解析的沙盒共享卷（P3-A7）：chatSandbox 客户端把输入文件写到
      # /work/users/<uid>/ingest/，与 sandbox 容器的 /work 指向同一宿主目录
      # （deploy/data/agent）。缺少该挂载时 agent 容器内没有 /work，写输入文件
      # 失败导致「文档上传失败」。rag 容器同理挂载 /work（见下）。
      - ./data/agent:/work
      - logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8182/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  rag:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: rag }
    environment:
      DB_HOST: postgres
      DB_NAME: rag
      DB_PASSWORD: ${DB_PASSWORD}
      GRPC_PORT: "8085"
      HTTP_PORT: "8185"
      # RAG embedding 供应商（P3-A）：默认本地 Ollama（开源免费，无需密钥）。
      # 端点指向 compose 网络内的 ollama 服务；bge-m3 1024 维（与迁移建表一致）。
      # 切云端硅基流动（可选）：设 SILICONFLOW_API_KEY 并覆盖下面两个地址/模型
      #   RAG_EMBEDDING_BASE_URL=https://api.siliconflow.cn/v1
      #   RAG_EMBEDDING_MODEL=BAAI/bge-m3
      # 注意：本地 go run（非 docker）时仅设 SILICONFLOW_API_KEY 即自动切云端（config.go）。
      # 未配置任何供应商或端点不可达时 rag 照常启动，相关接口返回"未配置"提示。
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-bge-m3}
      RAG_EMBEDDING_DIM: 1024
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      # 摄取并发与轮询间隔（默认 2 worker / 1s）。
      # RAG_INGEST_WORKERS=2
      # RAG_INGEST_POLL_MS=1000
      # PDF/DOCX/PPTX 委托沙盒解析（P3-A3b）：rag 把文档字节写入共享卷
      # （./data/agent，容器内视角 /work，与 sandbox 同路径）→ POST /v1/exec
      # profile 执行预置解析脚本 → 读回统一 JSON。留空 = 仅支持 md/txt/html/xlsx。
      RAG_SANDBOX_URL: http://sandbox:8087
      RAG_SANDBOX_WORK_ROOT: /work
      # 解析沙盒固定使用的工作区用户 id（摄取是管理端后台上传，按上传者隔离
      # 意义不大；固定值简化权限链路，如多管理员并存可改大）。
      RAG_SANDBOX_USER_ID: ${RAG_SANDBOX_USER_ID:-1}
      # 无主 rag-media 目录定期清理（模块三）：文档删除后残留的孤儿媒体目录
      # 在宽限期后兜底删除（间隔 0 = 禁用）。
      RAG_MEDIA_CLEANUP_INTERVAL_HOURS: ${RAG_MEDIA_CLEANUP_INTERVAL_HOURS:-6}
      RAG_MEDIA_CLEANUP_TTL_HOURS: ${RAG_MEDIA_CLEANUP_TTL_HOURS:-168}
      # 单篇文档字节上限（摄取入队校验；与 ADMIN_KB_UPLOAD_MAX_MB 语义一致）。
      RAG_MAX_DOC_MB: ${RAG_MAX_DOC_MB:-20}
      LOG_FILE: /logs/rag.log
    ports:
      - "8085:8085" # gRPC
      - "8185:8185" # healthz
    volumes:
      # 与 sandbox 挂载同一宿主目录（容器内视角 /work）：rag 写用户工作区
      # ingest 临时目录供沙盒降权进程读取，媒体持久化到 rag-media/。
      - ./data/agent:/work
      - logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      # ollama 是软依赖：不在这里 depends_on，模型未就绪时 rag 照样启动。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8185/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: gateway }
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_AUTH_ADDR: auth:8081
      GATEWAY_AGENT_ADDR: agent:8082
      GATEWAY_RAG_ADDR: rag:8085
      # /files 媒体代理目标（P2-AN 修复）：容器网络内的 agent HTTP 服务，而非
      # 容器自身 localhost——默认 localhost:8182 在 gateway 容器内指向自身，
      # 导致用户气泡图片（经 gateway 拉取）代理失败、降级为文件卡片。
      GATEWAY_AGENT_HTTP_ADDR: http://agent:8182
      # 用量聚合查询：指向 compose 网络内的 llm-gateway，而非容器自身 localhost。
      # 缺省 localhost:8083 在容器内指向 gateway 自身，导致详情页用量"服务不可达"。
      GATEWAY_LLM_BASE_URL: http://llm-gateway:8083
      # 模型注册表管理令牌（P3 大模型管理）：与 llm-gateway 共享同一值，
      # 管理端模型模块经此令牌代理读写 llm-gateway 的模型注册表。
      LLM_ADMIN_TOKEN: ${LLM_ADMIN_TOKEN:-}
      # 跨域白名单：web dev / Tauri dev / 桌面端打包版 origin（tauri.localhost）。
      # 缺桌面端 origin 时桌面端所有请求被浏览器拦截 → "无法连接服务器"。
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-}
      HTTP_PORT: "8080"
      # 管理端文件态配置平面：与 agent 共享同一份 skill 目录与 MCP 配置文件。
      # 管理端保存 → 文件变化 → agent fsnotify 热加载，全程免重启。
      ADMIN_SKILLS_DIR: /app/skills
      ADMIN_MCP_CONFIG_FILE: /app/mcp_servers.json
      ADMIN_MCP_SERVERS_DIR: /app/mcp-servers
      # 管理端上传限制（P4-L 收口 env）：KB 文档 20MB、技能/MCP zip 10MB。
      # KB 单文档上限与 rag 侧 RAG_MAX_DOC_MB 语义对齐（gRPC 透传由 rag 兜底）。
      GATEWAY_CHAT_UPLOAD_MAX_MB: ${GATEWAY_CHAT_UPLOAD_MAX_MB:-20}
      ADMIN_KB_UPLOAD_MAX_MB: ${ADMIN_KB_UPLOAD_MAX_MB:-20}
      ADMIN_SKILL_UPLOAD_MAX_MB: ${ADMIN_SKILL_UPLOAD_MAX_MB:-10}
      LOG_FILE: /logs/gateway.log
    ports:
      - "8080:8080" # 对外唯一入口
    volumes:
      # 与 agent 挂载同一宿主目录，保证读写的是同一份技能/MCP 配置。
      - ./data/agent:/app
      - logs:/logs
    depends_on:
      auth:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

volumes:
  pgdata:
  logs:
  mplconfig:
