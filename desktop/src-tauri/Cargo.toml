[package]
name = "agent-desktop"
version = "0.1.0"
description = "星云 Nebula 桌面端（Tauri 2 + Rust 壳）"
authors = ["agent-framework contributors"]
edition = "2021"
rust-version = "1.77"

# 库目标：Tauri 要求 lib 名用下划线（main.rs 引用 lib 的 run()）
[lib]
name = "agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 托盘（桌面端专属）：启用 tauri 的 tray-icon 得到 tauri::tray / tauri::menu 模块。
# tauri 内部用 #[cfg(all(desktop, feature="tray-icon"))] 门控，安卓（非 desktop）
# 即使 feature 启用也不编译该模块，因此默认启用不影响安卓构建。
default = ["tray-icon"]
tray-icon = ["tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = [] }
# 系统通知（P2-85）
tauri-plugin-notification = "2"
# 外部链接/文件打开（跨平台，安卓端用系统浏览器打开 URL 的正确方案）
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows 中文控制台输出解码（GBK→UTF-8）：cmd 错误信息/中文文件内容兜底解码
encoding_rs = "0.8"
# 系统凭据库（记住密码，P 阶段1）：Windows 凭据管理器 / macOS Keychain / Linux Secret Service
keyring = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
