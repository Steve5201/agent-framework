<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">一次对话的数据流（SSE 事件序列）</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#64748b">前端 → gateway → agent → llm-gateway → 外部模型 · 流式增量回传 · 消息按轮/版本落库</text>

  <!-- ============ 泳道 ============ -->
  <text x="120" y="92" font-size="12" font-weight="bold" fill="#334155">Client (web/desktop)</text>
  <line x1="60" y1="100" x2="340" y2="100" stroke="#cbd5e1"/>
  <text x="560" y="92" font-size="12" font-weight="bold" fill="#334155">gateway :8080</text>
  <line x1="380" y1="100" x2="740" y2="100" stroke="#cbd5e1"/>
  <text x="940" y="92" font-size="12" font-weight="bold" fill="#334155">agent :8082（framework 循环）</text>
  <line x1="780" y1="100" x2="1180" y2="100" stroke="#cbd5e1"/>

  <!-- 事件 -->
  <text x="120" y="128" font-size="12" fill="#475569">① POST /api/chat（用户消息）</text>
  <path d="M 300 120 L 390 120" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 700 120 L 790 120" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="120" y="160" font-size="12" fill="#16a34a">② 200 → SSE 连接建立（流式返回）</text>
  <path d="M 790 152 L 700 152" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 390 152 L 300 152" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="940" y="184" font-size="12" fill="#475569">③ agent → llm-gateway /v1/chat/completions</text>
  <path d="M 1060 176 L 1060 210 L 940 210" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="120" y="220" font-size="12" fill="#475569">④ event: task_status（编排进度，可选）</text>
  <path d="M 790 212 L 700 212" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 390 212 L 300 212" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="120" y="256" font-size="12" fill="#475569">⑤ event: thinking（推理片段）</text>
  <path d="M 790 248 L 700 248" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 390 248 L 300 248" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="120" y="292" font-size="12" fill="#475569">⑥ event: delta（内容增量 × N）</text>
  <path d="M 790 284 L 700 284" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 390 284 L 300 284" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="120" y="328" font-size="12" fill="#475569">⑦ event: tool_calls（工具调用声明）</text>
  <path d="M 700 320 L 790 320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="940" y="336" font-size="11" fill="#94a3b8">工具执行（sandbox / kb_search / MCP…）</text>
  <text x="120" y="364" font-size="12" fill="#475569">⑧ event: delta（工具结果回填后继续）</text>
  <path d="M 790 356 L 700 356" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 390 356 L 300 356" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="120" y="400" font-size="12" fill="#16a34a">⑨ event: done（落库完成）</text>
  <path d="M 790 392 L 700 392" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 390 392 L 300 392" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="120" y="436" font-size="12" fill="#dc2626">⑩ event: error / 打断（persistPartialOnError）</text>
  <path d="M 790 428 L 700 428" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 390 428 L 300 428" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="120" y="458" font-size="11" fill="#94a3b8">已生成部分内容先落库（context.WithoutCancel）· 前端重拉历史回填 serverId</text>

  <text x="120" y="492" font-size="11" fill="#64748b">前端流控制：AbortController 中断 · AbortError 不算错误 · 空闲超时走 onError · 停止后重拉历史前缀匹配</text>

  <!-- ============ 消息模型 ============ -->
  <rect x="40" y="516" width="1200" height="240" rx="14" fill="#eef2ff" stroke="#6366f1"/>
  <text x="80" y="546" font-size="15" font-weight="bold" fill="#4338ca">消息模型与版本管理（后端 Message · 前端 ChatMessage）</text>

  <rect x="80" y="566" width="560" height="90" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="100" y="590" font-size="12" font-weight="bold" fill="#3730a3">落库字段</text>
  <text x="100" y="612" font-size="12" fill="#475569">round_no 轮次 · version 版本号（0=初始，重生成递增）</text>
  <text x="100" y="632" font-size="12" fill="#475569">total_versions 本轮版本总数 · hidden 可见性 · seq 顺序</text>
  <text x="100" y="652" font-size="11" fill="#94a3b8">前端 ChatMessage：id/serverId/role/content/status/thinking/toolNames/tasks/roundNo/version/totalVersions</text>

  <rect x="660" y="566" width="560" height="90" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="680" y="590" font-size="12" font-weight="bold" fill="#3730a3">版本操作</text>
  <text x="680" y="612" font-size="12" fill="#475569">HideRoundAndAfter 截断旧分支 → 生成新版本</text>
  <text x="680" y="632" font-size="12" fill="#475569">RestoreRoundAndAfter 失败回滚（WithoutCancel）</text>
  <text x="680" y="652" font-size="12" fill="#475569">SetActiveVersion 切换活跃版本 · branch 另起分支</text>

  <!-- 版本示例 -->
  <rect x="80" y="672" width="240" height="66" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="200" y="696" text-anchor="middle" font-size="12" fill="#6d28d9">round=2 · v0（原回答）</text>
  <text x="200" y="718" text-anchor="middle" font-size="11" fill="#94a3b8">assistant · total_versions=2</text>

  <rect x="340" y="672" width="240" height="66" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="460" y="696" text-anchor="middle" font-size="12" fill="#6d28d9">round=2 · v1（重新生成）</text>
  <text x="460" y="718" text-anchor="middle" font-size="11" fill="#94a3b8">活跃 · 其它版本隐藏</text>

  <rect x="600" y="672" width="300" height="66" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="750" y="696" text-anchor="middle" font-size="12" fill="#6d28d9">branch（分支 → 新会话路径）</text>
  <text x="750" y="718" text-anchor="middle" font-size="11" fill="#94a3b8">基于某版本另起一轮</text>

  <rect x="920" y="672" width="300" height="66" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1070" y="696" text-anchor="middle" font-size="12" fill="#15803d">摘要消息（system）</text>
  <text x="1070" y="718" text-anchor="middle" font-size="11" fill="#94a3b8">__condense_v1__ 压缩 · __orch_v1__ 编排摘要</text>

  <text x="640" y="766" text-anchor="middle" font-size="11" fill="#94a3b8">所属主图区块：接入层与 agent 服务 · 返回 system-overview.svg</text>
</svg>
