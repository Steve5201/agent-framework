<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">framework · Agent 核心循环</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#64748b">「调 LLM → 执行工具 → 再调 LLM」直到最终回答 · 会话级 Session 状态机（run.go / stream.go）</text>

  <!-- ============ Session 配置 ============ -->
  <rect x="80" y="82" width="1120" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="106" font-size="14" font-weight="bold" fill="#334155">Session 配置</text>
  <text x="120" y="130" font-size="12" fill="#475569">Model（模型跟随） · MaxRounds（循环上限） · MaxThinkingRounds（思考轮护栏） · SystemPrompt（动态拼装不入窗口） · Thinking（思考模式） · Approval 回调（用户确认） · ToolAudit 回调（审计）</text>

  <!-- ============ 左：记忆 ============ -->
  <rect x="80" y="200" width="220" height="280" rx="12" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="190" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">记忆 memory</text>
  <rect x="100" y="244" width="180" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="190" y="264" text-anchor="middle" font-size="12" fill="#14532d">短期记忆</text>
  <text x="190" y="284" text-anchor="middle" font-size="11" fill="#94a3b8">窗口裁剪不切开</text>
  <text x="190" y="298" text-anchor="middle" font-size="11" fill="#94a3b8">assistant↔tool 配对</text>
  <rect x="100" y="306" width="180" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="190" y="326" text-anchor="middle" font-size="12" fill="#14532d">长期记忆</text>
  <text x="190" y="346" text-anchor="middle" font-size="11" fill="#94a3b8">文件持久化 / 检索</text>
  <rect x="100" y="368" width="180" height="62" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="190" y="388" text-anchor="middle" font-size="12" fill="#14532d">上下文压缩</text>
  <text x="190" y="408" text-anchor="middle" font-size="11" fill="#94a3b8">超窗早期消息 →</text>
  <text x="190" y="422" text-anchor="middle" font-size="11" fill="#94a3b8">摘要 system 消息</text>

  <!-- ============ 中央主循环 ============ -->
  <!-- 1 用户消息 -->
  <rect x="360" y="170" width="560" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="640" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">① 用户消息 → mem.Add（role=user）</text>
  <path d="M 300 194 L 356 194" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="220" y="170" width="80" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#475569">输入</text>

  <!-- 2 压缩 -->
  <path d="M 640 218 L 640 238" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="360" y="240" width="560" height="48" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="640" y="270" text-anchor="middle" font-size="14" fill="#15803d">② condenseContext：历史超窗先压缩再进首轮</text>

  <!-- 3 LLM -->
  <path d="M 640 288 L 640 308" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="360" y="310" width="560" height="64" rx="8" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="640" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">③ 调 LLM：system + 窗口历史 + 工具说明书</text>
  <text x="640" y="358" text-anchor="middle" font-size="12" fill="#475569">buildRequest → provider.Chat（含 reasoning / tool_calls）</text>

  <!-- 4 assistant 入记忆 -->
  <path d="M 640 374 L 640 394" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="360" y="396" width="560" height="48" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="640" y="426" text-anchor="middle" font-size="14" fill="#15803d">④ assistant 入记忆（含 tool_calls / reasoning）</text>

  <!-- 5 判断 -->
  <path d="M 640 444 L 640 470" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <polygon points="640,472 760,508 640,544 520,508" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="640" y="506" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">⑤ 有工具调用？</text>

  <!-- 无工具 → 最终回答 -->
  <path d="M 520 508 L 160 508 L 160 640" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="180" y="498" font-size="12" fill="#16a34a">无 → 最终回答</text>
  <rect x="60" y="640" width="200" height="56" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="160" y="664" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Result 返回</text>
  <text x="160" y="684" text-anchor="middle" font-size="11" fill="#94a3b8">空回复 → ErrEmptyReply</text>

  <!-- 有工具 → 执行 -->
  <path d="M 760 508 L 1000 508 L 1000 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="980" y="490" font-size="12" fill="#64748b">有 → 执行工具</text>

  <!-- 6 execTool -->
  <rect x="920" y="340" width="300" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1070" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">⑥ execTool（逐个执行）</text>
  <text x="1070" y="388" text-anchor="middle" font-size="12" fill="#475569">SchemaByName → External 派发 → Approval → Execute</text>

  <!-- 7 结果回填 -->
  <path d="M 1070 404 L 1070 640 L 940 640" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1080" y="560" font-size="12" fill="#64748b">⑦ tool 结果回填记忆（role=tool）→ 回到 ③</text>
  <rect x="740" y="620" width="200" height="48" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="840" y="648" text-anchor="middle" font-size="12" fill="#15803d">护栏：轮数/思考轮上限</text>

  <!-- 工具注册表 -->
  <rect x="920" y="180" width="300" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1070" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">工具注册表 tool</text>
  <text x="940" y="232" font-size="12" fill="#475569">· Schemas() 说明书进请求</text>
  <text x="940" y="252" font-size="12" fill="#475569">· Execute(ctx, call, approved)</text>
  <text x="940" y="272" font-size="12" fill="#475569">· External 异步（AsyncRunner）</text>
  <text x="940" y="292" font-size="12" fill="#475569">· 每次调用 → ToolAudit 审计</text>

  <!-- ============ 底部：流式分支 ============ -->
  <rect x="60" y="726" width="1160" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="640" y="752" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">流式 RunStream（SSE）：onDelta 增量 · reasoning 思考 · tool_calls · done 收尾</text>
  <text x="640" y="774" text-anchor="middle" font-size="11" fill="#64748b">错误路径：已生成部分内容先提交记忆 → agentsvc persistPartialOnError 用 context.WithoutCancel 落库（打断不丢已生成内容）</text>

  <text x="80" y="744" text-anchor="middle" font-size="11" fill="#94a3b8"></text>
</svg>
