<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">
    P4 · 多 Agent 编排框架 —— 编排器 = 一个 Agent + 编排工具集
  </text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">
    复用现有 agent.Session 执行循环 / llm / tool / schema，不改框架主循环
  </text>

  <!-- ============ 1. 系统接入链 ============ -->
  <rect x="40"  y="76" width="150" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="101" text-anchor="middle" font-size="13" fill="#334155">前端 ChatPage</text>

  <rect x="250" y="76" width="150" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="325" y="101" text-anchor="middle" font-size="13" fill="#334155">gateway :8080</text>

  <rect x="460" y="76" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="545" y="101" text-anchor="middle" font-size="13" fill="#334155">agent-service :8082</text>

  <rect x="690" y="76" width="170" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="775" y="101" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">framework orchestrate</text>

  <line x1="190" y1="96" x2="246" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="96" x2="456" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="96" x2="686" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="218" y="68" text-anchor="middle" font-size="11" fill="#94a3b8">SSE</text>
  <text x="428" y="68" text-anchor="middle" font-size="11" fill="#94a3b8">gRPC</text>
  <text x="658" y="68" text-anchor="middle" font-size="11" fill="#94a3b8">mode=orchestrate</text>

  <!-- ============ 2. 编排核心 ============ -->
  <!-- Orchestrator 主框 -->
  <rect x="50" y="160" width="280" height="240" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">编排器 Orchestrator</text>
  <text x="190" y="206" text-anchor="middle" font-size="12" fill="#64748b">主 Agent（复用 Session 循环）</text>

  <rect x="70" y="222" width="240" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="190" y="242" text-anchor="middle" font-size="12" fill="#334155">① 任务分解 planner（固定模板 / LLM 动态）</text>
  <rect x="70" y="262" width="240" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="190" y="282" text-anchor="middle" font-size="12" fill="#334155">② 调度执行 executor（DAG 并行）</text>
  <rect x="70" y="302" width="240" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="190" y="322" text-anchor="middle" font-size="12" fill="#334155">③ 结果合并 aggregator</text>

  <rect x="70" y="348" width="240" height="34" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="190" y="369" text-anchor="middle" font-size="11" fill="#1d4ed8">编排工具集：delegate_task / report / finalize</text>

  <!-- 子 Agent 2x2 -->
  <rect x="390" y="160" width="210" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="495" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">子 Agent A · 研究</text>
  <text x="495" y="204" text-anchor="middle" font-size="12" fill="#4b5563">知识检索 / 资料收集</text>
  <text x="495" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">独立 AgentConfig + 输出 schema</text>

  <rect x="630" y="160" width="210" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="735" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">子 Agent B · 大纲</text>
  <text x="735" y="204" text-anchor="middle" font-size="12" fill="#4b5563">结构设计 / 章节划分</text>
  <text x="735" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">依赖 A 的结果</text>

  <rect x="390" y="268" width="210" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="495" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">子 Agent C · 内容</text>
  <text x="495" y="312" text-anchor="middle" font-size="12" fill="#4b5563">章节撰写 / 例题生成</text>
  <text x="495" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">依赖 B 的结果</text>

  <rect x="630" y="268" width="210" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="735" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">子 Agent D · 审核</text>
  <text x="735" y="312" text-anchor="middle" font-size="12" fill="#4b5563">质量把关 / 合规检查</text>
  <text x="735" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">依赖 C 的结果</text>

  <!-- 合并与回答 -->
  <rect x="870" y="176" width="90" height="56" rx="8" fill="#faf5ff" stroke="#9333ea"/>
  <text x="915" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">结果合并</text>
  <text x="915" y="217" text-anchor="middle" font-size="11" fill="#6b7280">aggregator</text>

  <rect x="870" y="268" width="90" height="56" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="915" y="291" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">最终回答</text>
  <text x="915" y="309" text-anchor="middle" font-size="11" fill="#6b7280">含过程轨迹</text>

  <!-- 分解箭头：Orchestrator → 子 Agent -->
  <line x1="330" y1="240" x2="386" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="330" y1="260" x2="386" y2="304" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="330" y1="270" x2="626" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="330" y1="280" x2="626" y2="304" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="300" y="225" font-size="11" fill="#2563eb">分解</text>

  <!-- 结果箭头：子 Agent → 合并 -->
  <line x1="600" y1="190" x2="866" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="298" x2="866" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="840" y1="214" x2="840" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="206" font-size="11" fill="#64748b">结果（按 schema）</text>

  <!-- ============ 3. 长任务运行 ============ -->
  <rect x="40" y="400" width="920" height="212" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="428" font-size="15" font-weight="bold" fill="#b45309">P4-D/E 长任务运行与中断恢复</text>

  <!-- 状态机 -->
  <rect x="90" y="452" width="110" height="36" rx="18" fill="#e2e8f0" stroke="#64748b"/>
  <text x="145" y="475" text-anchor="middle" font-size="13" fill="#334155">pending</text>

  <rect x="270" y="452" width="110" height="36" rx="18" fill="#dbeafe" stroke="#2563eb"/>
  <text x="325" y="475" text-anchor="middle" font-size="13" fill="#1d4ed8">running</text>

  <rect x="450" y="452" width="120" height="36" rx="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="475" text-anchor="middle" font-size="13" fill="#15803d">completed</text>

  <rect x="270" y="520" width="110" height="36" rx="18" fill="#fee2e2" stroke="#dc2626"/>
  <text x="325" y="543" text-anchor="middle" font-size="13" fill="#b91c1c">failed</text>

  <rect x="450" y="520" width="120" height="36" rx="18" fill="#fef3c7" stroke="#d97706"/>
  <text x="510" y="543" text-anchor="middle" font-size="13" fill="#b45309">interrupted</text>

  <line x1="200" y1="470" x2="266" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="470" x2="446" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="325" y1="488" x2="325" y2="516" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="536" x2="446" y2="536" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="510" y="430" font-size="11" fill="#64748b">可重试 / 降级</text>

  <!-- 说明 -->
  <rect x="610" y="452" width="330" height="44" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="628" y="472" font-size="12" fill="#334155">节点粒度进度上报</text>
  <text x="628" y="489" font-size="12" fill="#334155">→ SSE 事件 task_status / progress</text>

  <rect x="610" y="506" width="330" height="44" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="628" y="526" font-size="12" fill="#334155">中断恢复：orchestrations 表</text>
  <text x="628" y="543" font-size="12" fill="#334155">持久化任务图状态，重连续跑</text>

  <!-- 图例 -->
  <text x="500" y="630" text-anchor="middle" font-size="11" fill="#94a3b8">
    依赖纪律：orchestrate → agent / llm / tool / schema（不反向依赖）；新功能按批次解耦开发
  </text>
</svg>
