<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nebCore" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="nebBg" x1="120" y1="96" x2="392" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E7FF"/>
      <stop offset="0.5" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="nebHalo" x1="96" y1="80" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景（浅色渐变底） -->
  <rect width="512" height="512" fill="url(#nebBg)"/>

  <!-- 外层光晕 -->
  <ellipse cx="256" cy="256" rx="170" ry="170" fill="url(#nebHalo)" filter="url(#glow)"/>

  <!-- 环绕轨道（椭圆光弧，示意多智能体协作轨道） -->
  <ellipse cx="256" cy="256" rx="188" ry="96" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="4" fill="none" transform="rotate(-24 256 256)"/>
  <ellipse cx="256" cy="256" rx="188" ry="96" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="4" fill="none" transform="rotate(48 256 256)"/>

  <!-- 环绕节点（多智能体，沿轨道分布） -->
  <circle cx="428" cy="206" r="14" fill="#0EA5E9" filter="url(#glow)"/>
  <circle cx="352" cy="414" r="12" fill="#6366F1"/>
  <circle cx="138" cy="130" r="12" fill="#8B5CF6"/>
  <circle cx="86" cy="342" r="14" fill="#0EA5E9" filter="url(#glow)"/>
  <circle cx="408" cy="340" r="9" fill="#3B82F6"/>
  <circle cx="112" cy="196" r="9" fill="#A78BFA"/>

  <!-- 中心星云核心：多节点汇聚的光团 -->
  <circle cx="256" cy="256" r="82" fill="url(#nebCore)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="82" fill="url(#nebCore)"/>
  <!-- 核心高光 -->
  <circle cx="232" cy="230" r="30" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="256" cy="256" r="46" fill="#DBEAFE" fill-opacity="0.22"/>
  <!-- 核心内的小节点 -->
  <circle cx="298" cy="282" r="10" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="222" cy="292" r="7" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="276" cy="218" r="8" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="238" cy="214" r="5" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="300" cy="230" r="5" fill="#FFFFFF" fill-opacity="0.65"/>
</svg>